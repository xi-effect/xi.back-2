name: Rollback (Dispatch)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: github.triggering_actor == 'niqzart'
    environment: ${{ inputs.environment }}

    env:
      deploy_image: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_USERNAME }}:${{ secrets.DEPLOY_TAG }}

    steps:
      - name: Run SSH commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          username: ${{ secrets.SSH_USER }}
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSWORD }}
          script: |-
            cd ~/xieffect-core
            docker compose stop ${{ vars.compose_app_service }}
            docker compose run --rm --entrypoint alembic ${{ vars.compose_migration_service }} downgrade $(cat ${{ vars.version_filename }})
            docker image tag ${{ env.deploy_image }}-backup ${{ env.deploy_image }}
            docker compose up -d ${{ vars.compose_app_service }}
          script_stop: true

      - name: Report status to discord
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |-
            :repeat: Service xi.back-2 was successfully reverted to mainline

      - name: Report status to discord
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |-
            :bangbang: [Service xi.back-2 failed to revert to mainline](<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>)
